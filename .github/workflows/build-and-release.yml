name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.display_name }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - display_name: x86
            cmake_arch: Win32
            artifact_name: AIUsage-x86
          - display_name: x64
            cmake_arch: x64
            artifact_name: AIUsage-x64
          - display_name: arm64
            cmake_arch: ARM64
            artifact_name: AIUsage-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          # 如果是标签推送，使用标签中的版本号
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -like "v*") {
            $version = $env:GITHUB_REF_NAME.Substring(1)
            Write-Host "Using tag version: $version"
          }
          else {
            # 分支构建统一读取项目中的显式版本，避免 DLL、标签和 Release 版本不一致
            $cmake = Get-Content "CMakeLists.txt" -Raw
            if ($cmake -notmatch 'set\(CODEX_USAGE_VERSION\s+"([^"]+)"') {
              throw "CODEX_USAGE_VERSION not found in CMakeLists.txt"
            }
            $version = $Matches[1]
            Write-Host "Using project version: $version"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Configure
        run: >
          cmake
          -S .
          -B build/${{ matrix.display_name }}
          -A ${{ matrix.cmake_arch }}
          -DCMAKE_BUILD_TYPE=Release
          "-DCODEX_USAGE_VERSION=${{ steps.version.outputs.version }}"

      - name: Build
        run: cmake --build build/${{ matrix.display_name }} --config Release --target AIUsage CodexUsageTests ProxyHelperTests

      - name: Test
        if: matrix.display_name != 'arm64'
        run: ctest --test-dir build/${{ matrix.display_name }} -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          $packageDir = Join-Path $env:GITHUB_WORKSPACE "package\${{ matrix.artifact_name }}"
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          Copy-Item "build\${{ matrix.display_name }}\Release\AIUsagePreview.dll" $packageDir
          Copy-Item "AIUsage.ini" $packageDir
          Compress-Archive -Path "$packageDir\*" -DestinationPath "${{ matrix.artifact_name }}.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.zip
          if-no-files-found: error

  server:
    name: Build Go forwarder
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod

      - name: Test server
        working-directory: server
        run: go test ./...

      - name: Vet server
        working-directory: server
        run: go vet ./...

      - name: Test ag-login
        working-directory: tools/ag-login
        run: go test ./...

      - name: Create release-assets dir
        run: mkdir -p release-assets

      - name: Build server (linux amd64)
        working-directory: server
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags '-s -w' -o ../release-assets/aiusage-server-linux-amd64 .

      - name: Build server (linux arm64)
        working-directory: server
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags '-s -w' -o ../release-assets/aiusage-server-linux-arm64 .

      - name: Build server (windows amd64)
        working-directory: server
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags '-s -w' -o ../release-assets/aiusage-server-windows-amd64.exe .

      - name: Build ag-login (windows amd64)
        working-directory: tools/ag-login
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags '-s -w' -o ../../release-assets/ag-login.exe .

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: AIUsage-server
          path: release-assets/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build, server]
    runs-on: windows-latest
    # 允许标签推送或 main 分支推送时执行
    if: (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')) || (github.ref_name == 'main')

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release-tag
        shell: pwsh
        run: |
          # 如果是标签推送，使用现有标签
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $tagName = $env:GITHUB_REF_NAME
          }
          # main 分支使用项目中的显式版本创建标签
          else {
            $cmake = Get-Content "CMakeLists.txt" -Raw
            if ($cmake -notmatch 'set\(CODEX_USAGE_VERSION\s+"([^"]+)"') {
              throw "CODEX_USAGE_VERSION not found in CMakeLists.txt"
            }
            $tagName = "v$($Matches[1])"
          }
          Write-Host "Release tag: $tagName"
          "tag=$tagName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Create tag (for main branch)
        if: github.ref_name == 'main'
        shell: bash
        run: |
          if git rev-parse "${{ steps.release-tag.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.release-tag.outputs.tag }} already exists, skipping"
          else
            git tag ${{ steps.release-tag.outputs.tag }}
            git push origin ${{ steps.release-tag.outputs.tag }}
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (gh release view ${{ steps.release-tag.outputs.tag }} --repo $env:GITHUB_REPOSITORY >$null 2>&1) {
            Write-Host "Release ${{ steps.release-tag.outputs.tag }} already exists, skipping"
          } else {
            gh release create ${{ steps.release-tag.outputs.tag }} `
              release-assets\AIUsage-x86.zip `
              release-assets\AIUsage-x64.zip `
              release-assets\AIUsage-arm64.zip `
              release-assets\aiusage-server-linux-amd64 `
              release-assets\aiusage-server-linux-arm64 `
              release-assets\aiusage-server-windows-amd64.exe `
              release-assets\ag-login.exe `
              --repo $env:GITHUB_REPOSITORY `
              --title ${{ steps.release-tag.outputs.tag }} `
              --generate-notes
          }
