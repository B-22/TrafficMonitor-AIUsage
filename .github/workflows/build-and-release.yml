name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.display_name }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - display_name: x86
            cmake_arch: Win32
            artifact_name: AIUsage-x86
          - display_name: x64
            cmake_arch: x64
            artifact_name: AIUsage-x64
          - display_name: arm64
            cmake_arch: ARM64
            artifact_name: AIUsage-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          # 如果是标签推送，使用标签中的版本号
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -like "v*") {
            $version = $env:GITHUB_REF_NAME.Substring(1)
            Write-Host "Using tag version: $version"
          }
          # 如果是 main 分支推送，自动增长版本号
          elseif ($env:GITHUB_REF_NAME -eq "main") {
            # 获取最新标签
            $latestTag = git tag --list 'v*' --sort=-v:refname | Select-Object -First 1
            if ($latestTag) {
              # 移除 'v' 前缀并解析版本号
              $versionStr = $latestTag.Substring(1)
              $parts = $versionStr -split '\.'
              if ($parts.Count -ge 3) {
                # 自动增长补丁版本号
                $major = [int]$parts[0]
                $minor = [int]$parts[1]
                $patch = [int]$parts[2] + 1
                $version = "$major.$minor.$patch"
              } else {
                $version = "0.1.0"
              }
            } else {
              $version = "0.1.0"
            }
            Write-Host "Auto-incremented version: $version"
          }
          else {
            $version = "0.1.0"
            Write-Host "Using default version: $version"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Configure
        run: >
          cmake
          -S .
          -B build/${{ matrix.display_name }}
          -G "Visual Studio 18 2026"
          -A ${{ matrix.cmake_arch }}
          -DCMAKE_BUILD_TYPE=Release
          "-DCODEX_USAGE_VERSION=${{ steps.version.outputs.version }}"

      - name: Build
        run: cmake --build build/${{ matrix.display_name }} --config Release --target AIUsage CodexUsageTests

      - name: Test
        if: matrix.display_name != 'arm64'
        run: ctest --test-dir build/${{ matrix.display_name }} -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          $packageDir = Join-Path $env:GITHUB_WORKSPACE "package\${{ matrix.artifact_name }}"
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          Copy-Item "build\${{ matrix.display_name }}\Release\AIUsagePreview.dll" $packageDir
          Copy-Item "AIUsage.ini" $packageDir
          Compress-Archive -Path "$packageDir\*" -DestinationPath "${{ matrix.artifact_name }}.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: windows-latest
    # 允许标签推送或 main 分支推送时执行
    if: (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')) || (github.ref_name == 'main')

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release-tag
        shell: pwsh
        run: |
          # 如果是标签推送，使用现有标签
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $tagName = $env:GITHUB_REF_NAME
          }
          # 如果是 main 分支推送，创建新标签
          else {
            # 获取最新标签
            $latestTag = git tag --list 'v*' --sort=-v:refname | Select-Object -First 1
            if ($latestTag) {
              $versionStr = $latestTag.Substring(1)
              $parts = $versionStr -split '\.'
              if ($parts.Count -ge 3) {
                $major = [int]$parts[0]
                $minor = [int]$parts[1]
                $patch = [int]$parts[2] + 1
                $tagName = "v$major.$minor.$patch"
              } else {
                $tagName = "v0.1.0"
              }
            } else {
              $tagName = "v0.1.0"
            }
          }
          Write-Host "Release tag: $tagName"
          "tag=$tagName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Create tag (for main branch)
        if: github.ref_name == 'main'
        run: |
          git tag ${{ steps.release-tag.outputs.tag }}
          git push origin ${{ steps.release-tag.outputs.tag }}

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ steps.release-tag.outputs.tag }} `
            release-assets\AIUsage-x86.zip `
            release-assets\AIUsage-x64.zip `
            release-assets\AIUsage-arm64.zip `
            --repo $env:GITHUB_REPOSITORY `
            --title ${{ steps.release-tag.outputs.tag }} `
            --generate-notes
