; =============================================
; AI Usage 插件配置
; 位置: TrafficMonitor 配置目录下 AIUsage.ini
; 修改后重启 TrafficMonitor 生效
; =============================================

[AIUsage]

; 圆环内是否显示百分比号
; 0 = 只显示数字(默认), 如 55
; 1 = 显示百分比号, 如 55%
ShowPctSign=0

; 是否显示 Credits 超额用量金额
; 0 = 隐藏, 1 = 显示(默认)
ShowCredits=1

; 是否显示 5 小时窗口重置时间
; 0 = 隐藏, 1 = 显示(默认)
ShowReset=1

; 是否显示 API 返回的订阅状态和红/绿点
; 0 = 隐藏(默认), 1 = 显示
ShowSubscription=0

; 是否显示 Claude/Codex 独立的数据新鲜度圆点和文字
; 超过1分钟未成功更新显示黄色，超过5分钟显示红色
; 0 = 隐藏, 1 = 显示(默认)
ShowStatus=1

; 是否显示 Claude 7天窗口重置星期
; 标签为 Claude，值显示为: 一、二、...日
; 0 = 隐藏, 1 = 显示(默认)
ShowClaude7dReset=1

; 是否显示 Codex 7天窗口重置星期
; 标签为 Codex，值显示为: 一、二、...日
; 0 = 隐藏, 1 = 显示(默认)
ShowCodex7dReset=1

; 7天重置时间/倒计时
; 自动选择 Claude 和 Codex 中较早的有效重置时间
; 只在进入阈值后显示，例如 "5h30m"
; <2h: 红色显示
; 0 = 隐藏, 1 = 显示(默认)
Show7dCountdown=1

; 距离重置多少小时后才显示倒计时
CountdownShowBeforeHours=12

; 是否独立显示手动设置的 Claude 到期日期
; 任务栏使用紧凑格式，如 8.13
ShowCustomExpiry=1

; Claude 订阅到期日期，配置使用 YYYY-MM-DD
CustomSubExpiry=2026-08-13

; =============================================
; 代理设置
; =============================================

; 代理服务器地址(可选)
; 留空 = 使用系统代理设置
; 示例: http://127.0.0.1:7890
ProxyServer=

; 是否强制要求代理
; 0 = 不阻止请求(默认), 适用于 TUN/VPN 等非系统代理场景
; 1 = 无系统代理时阻止请求
RequireProxy=0
