; =============================================
; AI Usage 插件配置
; 位置: TrafficMonitor 配置目录下 AIUsage.ini
; 修改后重启 TrafficMonitor 生效
; =============================================

[AIUsage]

; 圆环内是否显示百分比号
; 0 = 只显示数字(默认), 如 55
; 1 = 显示百分比号, 如 55%
ShowPctSign=0

; 是否显示 Credits 超额用量金额
; 0 = 隐藏, 1 = 显示(默认)
ShowCredits=1

; 是否显示 5 小时窗口重置时间
; 0 = 隐藏, 1 = 显示(默认)
ShowReset=1

; 是否显示 API 返回的订阅状态和红/绿点
; 0 = 隐藏(默认), 1 = 显示
ShowSubscription=0

; 是否显示 Claude/Codex 独立的数据新鲜度标记
; 超过1分钟在圆环数字下显示黄色短线，超过5分钟变红
; 超过10分钟时，Claude/Codex 的星期值改为紧凑过期分钟数
; 0 = 隐藏, 1 = 显示(默认)
ShowStatus=1

; 是否显示 Claude 7天窗口重置星期
; 标签为 Claude，值显示为: 一、二、...日
; 0 = 隐藏, 1 = 显示(默认)
ShowClaude7dReset=1

; 是否显示 Codex 7天窗口重置星期
; 标签为 Codex，值显示为: 一、二、...日
; 0 = 隐藏, 1 = 显示(默认)
ShowCodex7dReset=1

; 7天重置时间/倒计时
; 自动选择 Claude 和 Codex 中较早的有效重置时间
; 进入阈值后，将 Claude/Codex 原星期值分别替换为倒计时，例如 "5h30m"
; 0 = 隐藏, 1 = 显示(默认)
Show7dCountdown=1

; 距离重置多少小时后才显示倒计时
CountdownShowBeforeHours=24

; Show an urgent reset-credit expiry warning in the Codex weekday column.
; The compact value is rendered as "2卡18h" with a taskbar-contrast gradient.
ShowResetCreditWarning=1

; Warn when the earliest available reset credit expires within this many hours.
ResetCreditWarningHours=48

; Monitor public global-reset announcement windows.
; When a fresh official window is open, a gradient lightning marker appears
; immediately to the left of the three usage rings.
; These anonymous public requests keep any configured proxy route, but bypass
; RequireProxy and AllowedExitIPs because they never send account credentials.
ShowResetRadar=1

; Public radar refresh interval. Allowed range: 5-120 minutes.
ResetRadarRefreshMinutes=15

; Codex Runway reset-today feed refresh interval. Allowed range: 15-240
; minutes. The upstream feed normally updates once per hour.
RunwayResetRefreshMinutes=60

; 是否独立显示手动设置的 Claude 到期日期
; 任务栏使用紧凑格式，如 8.13
ShowCustomExpiry=0

; Claude 订阅到期日期，配置使用 YYYY-MM-DD
CustomSubExpiry=

; =============================================
; 代理设置
; =============================================

; 代理服务器地址(可选)
; 留空 = 使用系统代理设置
; 示例: http://127.0.0.1:PORT
ProxyServer=

; 是否强制要求代理
; 0 = 不按代理检测结果阻止请求(默认)
; 1 = 无显式/系统代理时阻止；若配置 AllowedExitIPs，则允许经校验的 TUN/VPN
RequireProxy=1

; 公网出口 IP 白名单（推荐 TUN/VPN 用户启用）
; 多个精确 IPv4/IPv6 使用逗号或分号分隔
; 一旦非空，每个 Claude/Codex HTTP 会话建立前都会校验；
; 检测失败或当前出口不在白名单时，请求会 fail-closed，不发送令牌或用量请求
; 示例: AllowedExitIPs=203.0.113.10,2001:db8::10
AllowedExitIPs=

; 返回调用方公网 IP 的纯文本 HTTPS 地址
; 安全校验禁止 HTTP 和重定向；通常无需修改
ExitIpCheckUrl=https://api.ipify.org/

; 1 = 在每次真实请求前，改用该请求目标域名的 /cdn-cgi/trace 检测出口
; 可确保检测与 API 请求命中同一个域名分流规则（推荐）
; 0 = 始终使用上面的 ExitIpCheckUrl
VerifyTargetHostExitIp=1
