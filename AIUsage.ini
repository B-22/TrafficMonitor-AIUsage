; =============================================
; AI Usage 插件配置
; 位置: TrafficMonitor 配置目录下 AIUsage.ini
; 修改后重启 TrafficMonitor 生效
; =============================================

[AIUsage]

; 圆环内是否显示百分比号
; 0 = 只显示数字(默认), 如 55
; 1 = 显示百分比号, 如 55%
ShowPctSign=0

; 是否显示 Credits 超额用量金额
; 0 = 隐藏, 1 = 显示(默认)
ShowCredits=1

; 是否显示 5 小时窗口重置时间
; 0 = 隐藏, 1 = 显示(默认)
ShowReset=1

; 是否显示订阅到期日期和状态红/绿点
; 0 = 隐藏, 1 = 显示(默认)
ShowSubscription=1

; 是否在数据过期时显示红色过期提示
; 正常时自动隐藏, 只有超过15分钟未更新才显示
; 0 = 隐藏, 1 = 显示(默认)
ShowStatus=1

; 是否显示 Claude 7天窗口重置星期
; 显示为: 周一、周二、...周日
; 0 = 隐藏(默认), 1 = 显示
ShowClaude7dReset=0

; 是否显示 Codex 7天窗口重置星期
; 显示为: 周一、周二、...周日
; 0 = 隐藏(默认), 1 = 显示
ShowCodex7dReset=0

; 自定义订阅到期日期(可选)
; 留空 = 使用 API 返回的数据
; 填写格式: 2026-12-20
CustomSubExpiry=

; =============================================
; 代理设置
; =============================================

; 代理服务器地址(可选)
; 留空 = 使用系统代理设置
; 示例: http://127.0.0.1:7890
ProxyServer=

; 是否强制要求代理
; 0 = 不阻止请求(默认), 适用于 TUN/VPN 等非系统代理场景
; 1 = 无系统代理时阻止请求
RequireProxy=0
